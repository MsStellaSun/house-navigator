# .github/workflows/scrape.yml
name: Weekly Shanghai Housing Data Sync

on:
  schedule:
    # 这里的 cron 表达式表示每周一凌晨 0 点运行一次（UTC 时间）
    - cron: '0 0 * * 1'
  workflow_dispatch: # 允许你手动点击按钮随时运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装爬虫依赖
        run: |
          pip install -r requirements.txt

      - name: 执行爬虫抓取 (fangdi.com.cn)
        run: python crawler.py

      - name: 提交并推送最新数据
        run: |
          git config --global user.name 'Data Bot'
          git config --global user.all 'bot@github.com'
          git add scraped_data.json
          git commit -m "Update housing data from official source [$(date)]" || echo "No changes to commit"
          git push
